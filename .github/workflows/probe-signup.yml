name: Live signup probe

# DIAGNOSTIC ONLY — never publishes artifacts and never touches secrets.
# Reproduces the reported "sign up not working" against the LIVE production
# API from a CI runner (the dev sandbox's egress is TLS-blocked, so the live
# Worker cannot be reached from there).
#
# Creates at most ONE clearly-labelled probe user row
# (ci-signup-probe+<timestamp>@rx-store.invalid) — safe to delete:
#   DELETE FROM users WHERE email LIKE 'ci-signup-probe+%';
#
# The probe output is committed to probe-output/latest.txt so it can be read
# without Actions log access. Those commits carry [skip ci] so they never
# re-trigger any workflow (no loops).

on:
  workflow_dispatch:
  push:
    branches: [arena/**]
    paths:
      - 'scripts/probe-live-signup.mjs'
      - '.github/workflows/probe-signup.yml'

concurrency:
  group: probe-signup-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  probe:
    name: Probe live /auth/register
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run live signup probe
        run: |
          mkdir -p probe-output
          node scripts/probe-live-signup.mjs 2>&1 | tee probe-output/latest.txt

      - name: Publish probe results to the branch (readable via git)
        if: always() && github.event_name == 'push'
        run: |
          git config user.name "probe-bot"
          git config user.email "probe@users.noreply.github.com"
          git add probe-output/latest.txt
          if git diff --cached --quiet; then
            echo "nothing new to commit"
          else
            git commit -m "chore(diag): live signup probe results (run ${{ github.run_number }}) [skip ci]"
            git push
          fi
