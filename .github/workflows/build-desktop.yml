name: Build & Release Desktop App

# HOW TO USE
# ----------
# 1. One runner, one job, zero races: every push to `main` builds EVERYTHING on
#    a single Ubuntu agent and publishes it to one GitHub Release:
#      - Windows installer  RXStore-Setup-<version>.exe  (+ latest.yml)
#      - Linux              rx-store_<version>_amd64.deb, RX-Store-<version>.AppImage (+ latest-linux.yml)
#      - Android            rx-store-<version>.apk
#    No separate Windows agent (the old matrix legs raced each other on the
#    same release and failed) — Ubuntu builds the Windows .exe too, using Wine
#    so the installer and app icon are embedded properly.
# 2. An editable copy lives at docs/workflow-build-desktop.yml — if a bot push
#    ever gets rejected for missing `workflows` permission, apply it locally:
#      cp docs/workflow-build-desktop.yml .github/workflows/build-desktop.yml
#      git add -A && git commit -m "ci: update build-desktop workflow" && git push
# 3. To ship an update to installed desktops: bump "version" in package.json
#    (or run `npm run release:patch`) and push — the new latest.yml makes the
#    desktop app self-update.
# 4. The Android SDK step is deliberately SELF-CONTAINED (plain shell, no
#    third-party action): android-actions/setup-android@v3 broke when GitHub
#    retired Node-20 actions (every push 2026-09-21 → 2026-09-24 failed at
#    that step; the v4 line shipped three patches in a single day). Ubuntu
#    runners ship the SDK preinstalled, so all we need is sdkmanager on PATH,
#    licenses accepted and the compileSdk platform present — and a fresh
#    cmdline-tools install from dl.google.com if the image ever drops it.
#
# OPTIONAL (recommended): signed Android release APK
# Add these repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64     base64 of a PKCS12 keystore
#   ANDROID_KEYSTORE_PASSWORD   keystore password
#   ANDROID_KEY_ALIAS           key alias
#   ANDROID_KEY_PASSWORD        key password
# When set, the release APK is signed with that key (stable across versions →
# in-place updates work). Without them, the APK is signed with the debug key
# (installable, but updating means uninstall + reinstall).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Back-to-back pushes queue up instead of racing on the same release.
concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish (Ubuntu)
    runs-on: ubuntu-latest
    # Vite replaces VITE_* values while compiling. Native packages cannot read
    # Cloudflare Pages environment variables after they have been installed, so
    # the API URL must be present in the renderer that is copied into the APK.
    env:
      # Accept either an Actions variable (preferred) or secret. Keeping the
      # fallback supports repositories that already stored this value as a secret.
      VITE_API_URL: ${{ vars.VITE_API_URL || secrets.VITE_API_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Verify production API configuration
        run: |
          set -e
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::Actions variable or secret VITE_API_URL is missing. Set it to the RX Store Worker URL (including /v1). Refusing to publish disconnected native apps."
            exit 1
          fi
          case "$VITE_API_URL" in
            https://*) ;;
            *) echo "::error::VITE_API_URL must use HTTPS: $VITE_API_URL"; exit 1 ;;
          esac
          API_BASE="${VITE_API_URL%/}"
          echo "Checking ${API_BASE}/health ..."
          curl --fail --silent --show-error --retry 3 --connect-timeout 10 --max-time 30 "${API_BASE}/health" > /dev/null

      - name: Build renderer (web build)
        run: npm run build:web

      - name: Build Electron main process
        run: npm run build:electron

      # Wine lets electron-builder embed the RX icon + version info into the
      # Windows .exe while building on Ubuntu (that's rcedit, needs `wine`).
      # Ubuntu's wine64 package ships NO PATH binary (it lands in
      # /usr/lib/wine/) — probe every known location, and if Wine truly isn't
      # there, still ship the installer via the no-metadata fallback.
      - name: Install Wine (for the Windows installer icon)
        id: wine
        run: |
          sudo apt-get update -y -o Acquire::Retries=3 || sudo apt-get update -y || true
          sudo apt-get install -y --no-install-recommends wine64 || sudo apt-get install -y --no-install-recommends wine || true
          WINEBIN="$(command -v wine || command -v wine64 || ls /usr/lib/wine/wine /usr/lib/wine/wine64 2>/dev/null | head -n 1 || true)"
          if [ -n "$WINEBIN" ]; then
            sudo ln -sf "$WINEBIN" /usr/local/bin/wine
            echo "wine_ok=1" >> "$GITHUB_OUTPUT"
            wine --version || true
          else
            echo "wine_ok=0" >> "$GITHUB_OUTPUT"
            echo "::warning::Wine unavailable — .exe ships without embedded icon/metadata; the installer itself is unaffected."
          fi

      - name: Build & publish Windows .exe + Linux .deb/.AppImage to GitHub Releases
        run: |
          set -e
          if [ "${{ steps.wine.outputs.wine_ok }}" = "1" ]; then
            npm run dist -- --publish always
          else
            npm pkg set build.win.signAndEditExecutable=false
            npm run dist -- --publish always
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Always (re)publish assets for this version, even if the release
          # was created more than 2 hours ago by an earlier push.
          EP_GH_IGNORE_TIME: 'true'

      # ----- Android APK -----
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Self-contained Android SDK setup — no third-party action (see the
      # workflow header, point 4). Ubuntu runners ship the SDK preinstalled;
      # we make sure sdkmanager is on PATH, licences are accepted and the
      # compileSdk platform exists, and fall back to a fresh cmdline-tools
      # install from dl.google.com if the image ever drops the SDK.
      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          [ -d "$SDK" ] || SDK="/usr/local/lib/android/sdk"
          find_sdkmanager() {
            for p in "$SDK/cmdline-tools/latest/bin/sdkmanager" \
                     "$SDK/cmdline-tools/bin/sdkmanager" \
                     "$SDK/tools/bin/sdkmanager"; do
              if [ -x "$p" ]; then printf '%s\n' "$p"; return 0; fi
            done
            return 1
          }
          if SDKMANAGER="$(find_sdkmanager)"; then
            echo "Using runner-provided Android SDK at $SDK"
          else
            echo "No cmdline-tools found on the runner — installing fresh SDK"
            SDK="$RUNNER_TEMP/android-sdk"
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL --retry 3 --connect-timeout 15 -o /tmp/cmdtools.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q /tmp/cmdtools.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "ANDROID_HOME=$SDK"        >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK"    >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools"      >> "$GITHUB_PATH"
          # Accept every SDK licence — AGP only auto-installs missing
          # build-tools/platforms when licences are accepted.
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          # Pre-install what we know the build needs (compileSdk 36); AGP
          # fetches anything else itself. Failures here are non-fatal.
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" >/dev/null || true
          "$SDKMANAGER" --install "build-tools;36.0.0" >/dev/null || true
          "$SDKMANAGER" --version

      - name: Build Android APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          npx cap sync android
          # Inject the signing keystore when the secrets are configured.
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release-keystore.p12
            echo "Keystore injected — release APK will be signed with it."
          else
            echo "No keystore secret — release APK will use the debug key (installable)."
          fi
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload Android APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          APK=$(ls android/app/build/outputs/apk/release/app-release.apk 2>/dev/null || true)
          if [ -z "$APK" ]; then
            echo "No release APK found."
            exit 0
          fi
          cp "$APK" "rx-store-$VERSION.apk"
          echo "Uploading rx-store-$VERSION.apk to $TAG ..."
          gh release upload "$TAG" "rx-store-$VERSION.apk" --clobber 2>/dev/null \
            || gh release create "$TAG" "rx-store-$VERSION.apk" --title "RX Store $VERSION" --notes "Android APK for $VERSION" \
            || echo "Upload failed (release may be busy) — will be retried on next push."
