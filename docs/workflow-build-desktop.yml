name: Build & Release Desktop App

# HOW TO USE
# ----------
# 1. This file lives at: .github/workflows/build-desktop.yml (an editable copy
#    is kept at docs/workflow-build-desktop.yml — if the bot token ever lacks
#    the `workflows` permission, apply it locally:
#      cp docs/workflow-build-desktop.yml .github/workflows/build-desktop.yml
#      git add -A && git commit -m "ci: add build-desktop workflow" && git push
# 2. From then on, EVERY push to `main`:
#      - builds Windows (NSIS .exe + latest.yml) and Linux (.deb + AppImage
#        + latest-linux.yml)
#      - builds an Android APK (Capacitor) and uploads it to the same release
#        as rx-store-<version>.apk — download from the release page and
#        sideload on your phone.
#      - publishes them to a real GitHub Release (not a draft/pre-release),
#        which is what the desktop self-updater reads.
#    No tags, no manual steps.
# 3. To ship an update to installed desktops: bump "version" in package.json
#    (or run `npm run release:patch`) and push — the new latest.yml makes the
#    app self-update.
#
# OPTIONAL (recommended): signed Android release APK
# Add these repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64     base64 of a PKCS12 keystore
#   ANDROID_KEYSTORE_PASSWORD   keystore password
#   ANDROID_KEY_ALIAS           key alias
#   ANDROID_KEY_PASSWORD        key password
# When set, the release APK is signed with that key (stable across versions →
# in-place updates work). Without them, the APK is signed with the debug key
# (installable, but updating means uninstall + reinstall).

on:
  push:
    branches: [main, arena/*]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    # PRs and non-main branches: build only, upload artifacts (no release).
    if: github.ref != 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build renderer (web build)
        run: npm run build:web

      - name: Build Electron main process
        run: npm run build:electron

      - name: Package Electron app
        run: npm run dist -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ----- Android APK (ubuntu leg only) -----
      - name: Set up JDK 21
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        if: matrix.os == 'ubuntu-latest'
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor web assets
        if: matrix.os == 'ubuntu-latest'
        run: npx cap sync android

      - name: Build Android APK (debug, installable)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: rx-store-android-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rx-store-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.yml
          if-no-files-found: warn

  release:
    name: Release ${{ matrix.os }}
    # Push to main: build AND publish a GitHub Release automatically.
    # Bump "version" in package.json to make desktop installs self-update.
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build renderer (web build)
        run: npm run build:web

      - name: Build Electron main process
        run: npm run build:electron

      - name: Build & publish desktop app to GitHub Releases
        run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Always (re)publish assets for this version, even if the release
          # was created more than 2 hours ago by an earlier push.
          EP_GH_IGNORE_TIME: 'true'

      # ----- Android APK (ubuntu leg only) -----
      - name: Set up JDK 21
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        if: matrix.os == 'ubuntu-latest'
        uses: android-actions/setup-android@v3

      - name: Build Android APK
        if: matrix.os == 'ubuntu-latest'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          npx cap sync android
          # Inject the signing keystore when the secrets are configured.
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release-keystore.p12
            echo "Keystore injected — release APK will be signed with it."
          else
            echo "No keystore secret — release APK will use the debug key (installable)."
          fi
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload Android APK to release
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          APK=$(ls android/app/build/outputs/apk/release/app-release.apk 2>/dev/null || true)
          if [ -z "$APK" ]; then
            echo "No release APK found."
            exit 0
          fi
          cp "$APK" "rx-store-$VERSION.apk"
          echo "Uploading rx-store-$VERSION.apk to $TAG ..."
          gh release upload "$TAG" "rx-store-$VERSION.apk" --clobber 2>/dev/null \
            || gh release create "$TAG" "rx-store-$VERSION.apk" --title "RX Store $VERSION" --notes "Android APK for $VERSION" \
            || echo "Upload failed (release may be busy) — will be retried on next push."
