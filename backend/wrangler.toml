# Rx Store — Cloudflare Worker Config
# SAFE: only creates rx-store-* resources. Never touches pharmagame/code-rx.
name = "rx-store-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
API_VERSION = "v1"
# CORS — explicit allowlist (comma-separated EXACT origins). First-party origins
# are built in; add approved deployment domains here. Never use suffix matching.
# rx-store-web.pages.dev is the production web frontend (from the applications.website
# record). PR-preview subdomains are intentionally NOT allowed.
CORS_ALLOWED_ORIGINS = "https://rx-store-web.pages.dev"
# Canonical web origin used to build storeUrl in the update-check API (SDK
# HTTPS fallback: {RX_STORE_WEB_URL}/app/{slug}). Must stay INSIDE [vars] —
# TOML tables end at the next [table] header (see the MALWARE_SCANNER lesson).
RX_STORE_WEB_URL = "https://rx-store-web.pages.dev"
# Password reset: email delivery runs through the Resend boundary when
# RESEND_API_KEY + FROM_EMAIL are set (production sends the reset email and
# NEVER returns the token; production without email reports 'unconfigured'
# truthfully). Non-production may return the token for local testing.
RESET_TOKEN_DEBUG = "0"
# AI — multi-provider (C: admin choice). Default = nvidia, fallback chain configurable.
AI_PROVIDER = "nvidia"
AI_MODEL = "meta/llama-3.1-8b-instruct"
AI_FALLBACK = "openrouter,openai,gemini"
AI_RATE_LIMIT = "30"
AI_BASE_URL_NVIDIA = "https://integrate.api.nvidia.com/v1"
AI_BASE_URL_OPENROUTER = "https://openrouter.ai/api/v1"
AI_BASE_URL_OPENAI = "https://api.openai.com/v1"
AI_BASE_URL_GEMINI = "https://generativelanguage.googleapis.com/v1beta"
# Package security (Phase 13) — malware scanner selection. NOTE: this MUST live
# inside [vars]; when it sat below the [[kv_namespaces]] table TOML attached it
# to the KV namespace (wrangler warning "Unexpected fields found in
# kv_namespaces[0]") and the value was never applied to the Worker.
MALWARE_SCANNER = "virustotal"

# D1 — isolated marketplace DB (create with: wrangler d1 create rx-store-db)
[[d1_databases]]
binding = "DB"
database_name = "rx-store-db"
database_id = "dc6f6d5c-9d7e-412f-8e35-b4d2ef7cfeec"

# R2 — marketplace storage (create with: wrangler r2 bucket create rx-store-storage)
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "rx-store-storage"

# KV — sessions / cache (create with: wrangler kv:namespace create rx-store-cache)
[[kv_namespaces]]
binding = "CACHE"
id = "bb99ae50606c4b6d92ee03c56781bea1"
preview_id = "e056396b15db4fd490a2f3024ffda05e"

# --- Package security pipeline (Phase 13) ---
# Malware scanning is PLUGGABLE and FAIL-CLOSED: with no scanner configured,
# packages stay UNAVAILABLE and are blocked from publication (admin override
# with a recorded reason is the only bypass).
#   MALWARE_SCANNER = "virustotal"  + secret VIRUSTOTAL_API_KEY  -> hash-lookup provider
#   MALWARE_SCANNER = "custom"      + MALWARE_SCANNER_URL (POST {sha256,size,filename,platform}
#                                    -> {status: CLEAN|DETECTED|FAILED|UNAVAILABLE, provider, version, details})
#                                    + optional secret MALWARE_SCANNER_KEY (Bearer)
# Optional dependency/metadata checker: DEP_SECURITY_URL (same response shape).
# The MALWARE_SCANNER value itself is set in [vars] above (TOML tables end at
# the next [table] header — anything typed below here belongs to the resource,
# not to the Worker's environment).
# Real scanner activation: set the VIRUSTOTAL_API_KEY secret (this stays "virustotal").
#   npx wrangler secret put VIRUSTOTAL_API_KEY
# Without the secret, results are honestly UNAVAILABLE and publication needs an override.

# --- Marketplace payments (Phase 18) ---
# Paystack is the production provider. The provider hosts ALL card/mobile-money
# authorization; RX Store never sees payment credentials. Production purchases
# require the PAYSTACK_SECRET_KEY secret — without it, production purchase
# attempts fail closed (no simulation exists in production).
# Webhook URL to set in the Paystack dashboard:
#   https://rx-store-api.calcitoninpay.workers.dev/payments/webhook/paystack

# --- OAuth secondary authentication (Google + GitHub) ---
# Optional secondary sign-in methods on top of email/password. Set BOTH the
# client id and client secret per provider to enable it; without them the
# provider button is hidden and the endpoints report not-configured.
#   npx wrangler secret put GOOGLE_CLIENT_ID     --config backend/wrangler.toml
#   npx wrangler secret put GOOGLE_CLIENT_SECRET --config backend/wrangler.toml
#   npx wrangler secret put GITHUB_CLIENT_ID     --config backend/wrangler.toml
#   npx wrangler secret put GITHUB_CLIENT_SECRET --config backend/wrangler.toml
# Registered callback URLs (must match EXACTLY):
#   Google: https://rx-store-api.calcitoninpay.workers.dev/auth/oauth/google/callback
#   GitHub: https://rx-store-api.calcitoninpay.workers.dev/auth/oauth/github/callback
# Local dev (wrangler dev, http://localhost:8787):
#   http://localhost:8787/auth/oauth/google/callback
#   http://localhost:8787/auth/oauth/github/callback
# Optional local-dev overrides (set in .dev.vars, never in Git):
#   OAUTH_WEB_URL  e.g. http://localhost:5173  (where the SPA runs)
#   OAUTH_API_BASE e.g. http://localhost:8787  (defaults to the request origin)
# Client secrets are backend-only. They are NEVER sent to the frontend bundle,
# never logged, and never returned in any API response.

# Secrets (set with: wrangler secret put <NAME>)
# JWT_SECRET (required)
# NVIDIA_API_KEY (nvapi-...), OPENAI_API_KEY (sk-...), OPENROUTER_API_KEY (sk-or-...), GEMINI_API_KEY (AIza...)
# PAYSTACK_SECRET_KEY, HUBTEL_API_KEY, MOBILE_MONEY_KEY
# Admin can also set keys via PUT /admin/ai/settings {provider, apiKey} (stored in D1 ai_settings)

[placement]
mode = "smart"
