[package]
name = "rx-store"
version = "1.0.0"
description = "RX Store - Digital Marketplace by Calcitonin Technologies"
authors = ["Calcitonin Technologies"]
license = "Proprietary"
repository = "https://github.com/calcitonin-tech/rx-store"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = [
    "shell-open",
    "updater",
    "system-tray",
    "notification",
    "fs-all",
    "http-all",
    "window-all",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1", features = ["full"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
