apply plugin: 'com.android.application'

// ---------- Version source of truth ----------
// The store's version lives in the ROOT package.json. Read it here so the APK's
// versionName matches the release and versionCode monotonically increases —
// otherwise Android treats an updated APK as the same version and in-place
// updates fail (the old version keeps being reported after install).
def rxVersionName = "1.0.0"
def rxVersionCode = 2
try {
    def pkg = new groovy.json.JsonSlurper().parseText(file('../../package.json').text)
    rxVersionName = (pkg.version ?: "1.0.0")
    def parts = rxVersionName.findAll(/\d+/)*.toInteger()
    rxVersionCode = parts.size() >= 3
        ? (parts[0] * 10000 + parts[1] * 100 + parts[2])
        : (parts.size() >= 2 ? (parts[0] * 10000 + parts[1] * 100) : 1)
    // versionCode must be >= 2 and increase on every bump.
    rxVersionCode = Math.max(rxVersionCode, 2)
} catch (Exception ignored) {
    logger.warn("Could not read root package.json — using fallback version $rxVersionName")
}

// ---------- Release signing flags (top level: shared by android{} + the guard) ----------
// SIGNING (production gate §2): the RELEASE build fails closed. Without the
// production keystore (injected by CI from repo secrets, or placed here for
// local release builds) a release APK is NEVER built — see the execution-time
// guard below the android{} block. Debug signing for release output is
// allowed ONLY for explicit local development, opt-in per-build:
//   ./gradlew assembleRelease -PrxAllowDebugSigning=true
//   (or env RX_ALLOW_DEBUG_SIGNING=1)
// NOTE: the failure must happen at EXECUTION time, not configuration time —
// Gradle evaluates every buildType while CONFIGURING even a plain
// `assembleDebug`, and a configuration-phase throw would break debug/CI
// builds that never asked for a release artifact.
def hasReleaseKeystore = file('release-keystore.p12').exists()
def rxAllowDebugSigning = (project.findProperty('rxAllowDebugSigning') ?: System.getenv('RX_ALLOW_DEBUG_SIGNING') ?: 'false').toString().toLowerCase() == 'true'

android {
    namespace = "com.calcitonin.rxstore"
    compileSdk = rootProject.ext.compileSdkVersion

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile file('release-keystore.p12')
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: 'changeit'
                keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: 'rxstore'
                keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: 'changeit'
                storeType 'PKCS12'
            }
        }
    }

    defaultConfig {
        applicationId "com.calcitonin.rxstore"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode rxVersionCode
        versionName rxVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            } else if (rxAllowDebugSigning) {
                // EXPLICIT local-development opt-in only. CI never sets this.
                logger.warn('WARNING: release APK is DEBUG-signed (local development opt-in). NEVER distribute this build.')
                signingConfig signingConfigs.debug
            }
            // No keystore + no opt-in: leave the release output UNSIGNED here.
            // The hard failure happens at EXECUTION time (guard below) so a
            // plain `assembleDebug` can configure without a keystore.
        }
    }
}

// ---------- Fail-closed guard (EXECUTION time, release tasks only) ----------
// Without a keystore and without the explicit local opt-in, producing a
// release artifact ABORTS with a clear error. This runs when the task
// actually executes, so `assembleDebug` (CI compile check, local dev) is
// never affected.
tasks.matching { task ->
    task.name in ['packageRelease', 'assembleRelease', 'bundleRelease', 'validateSigningRelease']
}.configureEach { task ->
    task.doFirst {
        if (!hasReleaseKeystore && !rxAllowDebugSigning) {
            throw new GradleException(
                'Production release signing is REQUIRED but no release keystore was found.\n' +
                'Inject android/app/release-keystore.p12 (CI secrets ANDROID_KEYSTORE_BASE64, ' +
                'ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) or run a local ' +
                'development build explicitly: ./gradlew assembleRelease -PrxAllowDebugSigning=true\n' +
                'A debug-signed production APK will NOT be built.')
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
